    transient: true
    status: verified

  # --- Debtor editor (part H; tests/fixtures/uia/editor_debtor_*.json). Only the selected
  # tab's fields are exposed, so address.* resolve in whichever address tab is selected.
  debtor.customer_id:
    named: {control_type: Edit, name: "Customer ID"}
    transient: true
    status: verified
    note: "proposed, e.g. CUST000004; kept, never typed"
  debtor.company:
