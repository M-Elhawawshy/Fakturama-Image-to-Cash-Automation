# Logical names -> how to find the control in Fakturama 2.2.0 (English UI).
# Version or language changes edit this file, not flow code.
#
# Query kinds:
#   named:          exact control_type + exact name (or name_regex, full match)
#   holder:         a container of control_type with a direct child matching a named query
#   label_sibling:  a Text with exactly this name, then the nth following sibling
#                   of sibling_type under the same parent (descend: true also
#                   searches inside those siblings, in document order)
# Optional per locator:
#   within: <key>   resolve inside the node another locator found
#   window: <re>    title regex of the top-level dialog window it lives in
#                   (default: the main window)
#   transient: true present only while a menu or view is open (locate skips it
#                   when absent instead of failing)
#   status:         verified (seen in a recorded tree with tests) | unverified
#                   (from agent findings; confirmed in the part named in `note`)

version: 1
app: "Fakturama 2.2.0 (English)"

locators:
  # --- main window toolbar (recorded 2026-11-05, tests/fixtures/uia/main_window.json)
  toolbar.new_order:
    named: {control_type: Button, name: "Create: New Order"}
    status: verified
  toolbar.save:
    named: {control_type: Button, name: "Save the current contents"}
    status: verified
  toolbar.master_group:
    holder: {control_type: ToolBar, contains: {control_type: SplitButton, name: "Create a new contact"}}
    status: verified
    note: "the main-toolbar group; the Products view has its own 'Create a new product' button"
  toolbar.new_product:
    named: {control_type: Button, name: "Create a new product"}
    within: toolbar.master_group
    status: verified
  toolbar.new_contact:
    named: {control_type: SplitButton, name: "Create a new contact"}
    within: toolbar.master_group
    status: verified

  # --- top-level menus (Invoke works; Expand intermittently fails, per findings)
  menu.file:
    named: {control_type: MenuItem, name: "File"}
    status: verified
  menu.data:
    named: {control_type: MenuItem, name: "Data"}
    status: verified

  # --- File menu, present only while expanded (Expand works; File exposes no Invoke)
  menu.file.expanded:
    named: {control_type: Menu, name: "File"}
    transient: true
    status: verified
    note: "recorded 2026-11-05, tests/fixtures/uia/main_file_menu.json"
  menu.file.preferences:
    named: {control_type: MenuItem, name: "Preferences"}
    within: menu.file.expanded
    status: verified

  # --- Data view tabs (present only while the view is open)
  view.documents:
    named: {control_type: TabItem, name: "Documents"}
    transient: true
    status: verified
  view.debtors:
    named: {control_type: TabItem, name: "Debtors"}
    transient: true
    status: verified
  view.products:
    named: {control_type: TabItem, name: "Products"}
    transient: true
    status: verified
  view.vats:
    named: {control_type: TabItem, name: "VATs"}
    transient: true
    status: verified
  view.payments:
    named: {control_type: TabItem, name: "terms of payment"}
    transient: true
    status: verified

  # --- Order editor (resolved in the bound editor pane; tests/fixtures/uia/order_editor*.json)
  order.no:
    label_sibling: {label: "No.", sibling_type: Edit, nth: 0, descend: true}
    transient: true
    status: verified
    note: "proposed number, e.g. PO000004; read, never typed"
  order.date:
    label_sibling: {label: "Date", sibling_type: Edit, nth: 0, descend: true}
    transient: true
    status: verified
    note: "segmented CDateTime, shows 'MMM d, yyyy'"
  order.price_mode:
    label_sibling: {label: "Date", sibling_type: ComboBox, nth: 0, descend: true}
    transient: true
    status: verified
    note: "unnamed ComboBox after Date: --- / Net / Gross"
  order.cust_ref:
    named: {control_type: Edit, name: "Cust.Ref."}
    transient: true
    status: verified
  order.vat_mode:
    named: {control_type: ComboBox, name: "VAT"}
    transient: true
    status: verified
    note: "With VAT / Free of Tax"
  order.consultant:
    named: {control_type: Edit, name: "Consultant"}
    transient: true
    status: verified
    note: "focus target to blur the header fields; never typed into"
  order.address_tab:
    named: {control_type: Tab, name: "Invoice address"}
    transient: true
    status: verified
    note: "the Tab is named after its selected tab; never switch to Delivery address (saving then crashes 2.2.0)"
  order.invoice_address:
    named: {control_type: Edit, name_regex: ".*"}
    within: order.address_tab
    transient: true
    status: verified
    note: "multi-line text, e.g. 'Learning Labs / Alice Smith / 10 Test Street / DE-10115 Berlin / Germany'"
  order.addresses.select_icon:
    label_sibling: {label: "Addresses", sibling_type: Image, nth: 0}
    transient: true
    status: verified
    note: "upper icon (existing contact); nth 1 is the green + (new Debtor). Behaviour confirmed in part E"
  order.items.select_icon:
    label_sibling: {label: "Items", sibling_type: Image, nth: 0}
    transient: true
    status: verified
    note: "first of four icons beside Items opens Select a product. Behaviour confirmed in part E"

  # --- selector dialogs (own top-level windows; tests/fixtures/uia/select_address.json)
  # The Search Edit sits inside a Pane after the label, hence descend.
  selector.search:
    label_sibling: {label: "Search:", sibling_type: Edit, nth: 0, descend: true}
    window: "^Select (the address|a product)$"
    status: verified
    note: "seen in Select the address; Select a product confirmed in part E"
  selector.ok:
    named: {control_type: Button, name: "OK"}
    window: "^Select (the address|a product)$"
    status: verified
  selector.cancel:
    named: {control_type: Button, name: "Cancel"}
    window: "^Select (the address|a product)$"
    status: verified

  # --- File > Preferences (dialog #32770; tests/fixtures/uia/prefs_*.json). Read, then Cancel.
  prefs.page.general:
    named: {control_type: TreeItem, name: "General"}
    window: "^Preferences$"
    status: verified
  prefs.page.documents:
    named: {control_type: TreeItem, name: "Documents"}
    window: "^Preferences$"
    status: verified
  prefs.take_over_item_number:
    named: {control_type: CheckBox, name: "immediately take over a clearly found item number"}
    window: "^Preferences$"
    status: verified
    note: "Documents page; must be off"
  prefs.currency_locale:
    named: {control_type: ComboBox, name: "Currency locale"}
    window: "^Preferences$"
    status: verified
    note: "General page"
  prefs.currency_example:
    named: {control_type: Edit, name: "Example"}
    window: "^Preferences$"
    status: verified
    note: "General page; formatted -1234.57 in the current currency settings"
  prefs.currency_decimals:
    named: {control_type: Edit, name: "decimal places (currency)"}
    window: "^Preferences$"
    status: verified
  prefs.cancel:
    named: {control_type: Button, name: "Cancel"}
    window: "^Preferences$"
    status: verified

  # --- Data menu (Invoke on the items opens or activates the view)
  menu.data.expanded:
    named: {control_type: Menu, name: "Data"}
    transient: true
    status: verified

  # --- view grid search bar (scope: the active view pane, named like the view)
  view.search_label:
    named: {control_type: Text, name: "Search:"}
    transient: true
    status: verified
    note: "resolved inside the view pane; the grid is the Pane following the search bar (parent of this label's parent)"

  # --- master-data editors opened from a Data view row (part F; tests/fixtures/uia/editor_*.json)
  vat.name:
    named: {control_type: Edit, name: "Name"}
    transient: true
    status: verified
  vat.value:
    named: {control_type: Edit, name: "Value"}
    transient: true
    status: verified
    note: "shows e.g. '19%'"
  vat.code:
    named: {control_type: ComboBox, name: "VAT code (E-Invoice)"}
    transient: true
    status: verified
    note: "e.g. 'S (Standard rate)'"
  payment.name:
    named: {control_type: Edit, name: "Name"}
    transient: true
    status: verified
  payment.code:
    named: {control_type: ComboBox, name: "!editorPaymentPaymentcode!"}
    transient: true
    status: verified
    note: "untranslated label in 2.2.0; values carry a trailing space, e.g. 'Credit transfer '"

  vat.description:
    named: {control_type: Edit, name: "Description"}
    transient: true
    status: verified
  payment.description:
    named: {control_type: Edit, name: "Description"}
    transient: true
    status: verified
  payment.discount:
    named: {control_type: Edit, name: "Cash discount"}
    transient: true
    status: verified
  payment.discount_days:
    named: {control_type: Edit, name: "Discount Days"}
    transient: true
    status: verified
  payment.net_days:
    named: {control_type: Edit, name: "Net Days"}
    transient: true
    status: verified

  # --- creating master data (part G; tests/fixtures/uia/editor_*_new.json)
  view.payments.create:
    named: {control_type: Button, name: "Create a new term of payment"}
    transient: true
    status: verified
    note: "in the terms of payment view toolbar; its neighbour 'Delete the marked entry' is never used"
  view.vats.create:
    named: {control_type: Button, name: "Create a new tax rate"}
    transient: true
    status: verified
  product.item_no:
    named: {control_type: Edit, name: "Item Number"}
    transient: true
    status: verified
  product.name:
    named: {control_type: Edit, name: "Name"}
    transient: true
    status: verified
  product.description:
    named: {control_type: Edit, name: "Description"}
    transient: true
    status: verified
  product.gross_price:
    label_sibling: {label: "Price (gross)", sibling_type: Edit, nth: 0, descend: true}
    transient: true
    status: verified
    note: "unnamed Edit in a Pane after the label; shows money, e.g. '$0.00'"
  product.cost_price:
    label_sibling: {label: "cost price (net)", sibling_type: Edit, nth: 0, descend: true}
    transient: true
    status: verified
  product.vat:
    named: {control_type: ComboBox, name: "VAT"}
    transient: true
    status: verified
    note: "lists the VAT names, e.g. 'Free of Tax', 'VAT 19%'; select it BEFORE the gross price (it recalculates gross)"
  product.stock:
    named: {control_type: Edit, name: "Stock"}
    transient: true
    status: verified

# Data views read by Select All + Copy (part C). Headers recorded 2026-11-05 and
# checked by OCR on every read; the copy itself has no header row.
tables:
  documents:
    view: "Documents"
    filter: "Orders"
    columns: ["", "Document", "Date", "Name", "Cust.Ref.", "State", "Total", "Printed"]
  debtors:
    view: "Debtors"
    columns: ["No.", "First Name", "Name", "Company", "ZIP", "City"]
  creditors:
    view: "Creditors"
    columns: ["No.", "First Name", "Name", "Company", "ZIP", "City"]
  products:
    view: "Products"
    columns: ["Item No.", "Name", "Description", "Stock", "Price", "VAT"]
  vats:
    view: "VATs"
    columns: ["Standard", "Name", "Description", "Value"]
  shippings:
    view: "Shippings"
    columns: ["Standard", "Name", "Description", "Value"]
  payments:
    view: "terms of payment"
    columns: ["Standard", "Name", "Description", "Discount", "Disc. Days", "Net Days"]

  # --- selector dialogs and the Order's item grid (part E). Their grids select one
  # row at a time (address) or allow Select All (product); both are read by walking
  # the rows. Copy only ever happens with a highlighted selection (Copy with nothing
  # selected raises "copiedCells is null" in Fakturama 2.2.0, seen 2026-11-05).
  select_address:
    view: "Select the address"
    row_header: ""
    columns: ["No.", "First Name", "Name", "Company", "ZIP", "City", "address type",
              "additional n...", "local consul..."]
    checked: 6  # up to City: OCR merges the touching headers to its right
  select_product:
    view: "Select a product"
    columns: ["Item No.", "Name", "Description", "Stock", "Price", "VAT"]
  order_items:
    view: "New Order"
    row_header: "Pos."
    columns: ["Qty.", "Item No.", "Picture", "Name", "Description", "VAT", "U.Price", "Discount", "Price"]
