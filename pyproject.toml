[project]
name = "fakturama-agent"
version = "0.1.0"
description = "Turn an order image into a saved, verified Order + linked Invoice in Fakturama 2.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.34.0",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "pywinauto==0.6.9",
    "pyyaml>=6.0.3",
    "rapidocr-onnxruntime>=1.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakturama_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live and not uia and not uia_write'"
markers = [
    "live: hits the network (Gemini); run explicitly with -m live",
    "uia: needs a running Fakturama, read-only; run with -m uia",
    "uia_write: creates records in Fakturama (back up the workspace first); run with -m uia_write",
]
filterwarnings = [
    "ignore:invalid escape sequence:SyntaxWarning",
]
