[project]
name = "fakturama-agent"
version = "0.1.0"
description = "Turn an order image into a saved, verified Order + linked Invoice in Fakturama 2.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakturama_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: hits the network (Gemini); run explicitly with -m live",
]
